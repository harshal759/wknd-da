version: 1

indices:
  site-en:
    include:
      - '/'
      - '/en'
      - '/en/**'
    exclude:
      - '/en/search'
      - '/en/nav'
      - '/en/footer'
    target: /query-index.json
    properties:
      path:
        select: head meta[property="og:url"]
        value: content

      title:
        select: main h1
        value: textContent

      header:
        select: main h1
        value: textContent

      description:
        select: head meta[name="description"]
        value: content

      image:
        select: main img
        value: src